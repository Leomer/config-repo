server:
  port: 8084

spring:
  mongodb:
    uri: mongodb://localhost:27017/transaction_db
    auto-index-creation: true
  kafka:
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest

services:
  account:
    url: http://account-service
  credit:
    url: http://credit-service

business:
  fixed-term-day: 15