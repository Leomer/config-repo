logging:
  level:
    root: INFO
    com.bank: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

resilience:
  timeout-seconds: 2
  sliding-window-size: 10
  minimum-calls: 5
  failure-rate-threshold: 50
  wait-open-seconds: 10

security:
  jwt:
    secret: change-this-secret-key-to-at-least-32-characters-long
