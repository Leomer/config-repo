server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customers/**
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/accounts/**
            - id: credit-service
              uri: lb://credit-service
              predicates:
                - Path=/credits/**
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/transactions/**
            - id: report-service
              uri: lb://report-service
              predicates:
                - Path=/reports/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: debit-card-service
              uri: lb://debit-card-service
              predicates:
                - Path=/debit-cards/**